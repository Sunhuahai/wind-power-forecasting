services:
  db:
    build:
      context: .
      dockerfile: docker/db-timescale.Dockerfile
    image: windpower/timescaledb:pg18.6-ts2.32.1
    # TimescaleDB 需要 shared_preload_libraries；扩展在各库中按激活脚本显式启用。
    command: ["postgres", "-c", "shared_preload_libraries=timescaledb"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-windpower}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-windpower_local}
      POSTGRES_DB: ${POSTGRES_DB:-windpower}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
