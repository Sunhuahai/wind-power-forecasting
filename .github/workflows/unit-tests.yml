name: Unit tests

on:
  pull_request:
  push:
    branches:
      - experiment/gefcom2014-kpower-reproduction

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --extra dev
      - run: uv run pytest -q
