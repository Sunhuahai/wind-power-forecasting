[project]
name = "wind-power-forecasting"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = ["psycopg[binary]>=3.2", "sqlalchemy>=2", "alembic>=1.14", "polars>=1.20", "numpy>=2", "scikit-learn>=1.6", "lightgbm>=4.6", "matplotlib>=3.10", "typer>=0.15", "python-dotenv>=1", "joblib>=1.4"]
[project.optional-dependencies]
dev = ["pytest>=8"]
[project.scripts]
windpower = "windpower.cli:app"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/windpower"]
[tool.pytest.ini_options]
testpaths = ["tests"]
